services:
  - type: web
    name: tennis-ai-api
    runtime: python
    # One PhoBERT model is retained at a time; 2 GB remains subject to the
    # deployment memory smoke test documented in MODEL_DEPLOYMENT.md.
    plan: standard
    buildCommand: bash scripts/download-models.sh && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 300 --access-logfile - --error-logfile - api_server:app
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: FLASK_DEBUG
        value: "false"
      - key: MAX_APRIORI_ROWS
        value: "50"
      - key: MAX_UPLOAD_BYTES
        value: "2097152"
      - key: TENNIS_MODEL_URL
        sync: false
      - key: TENNIS_MODEL_SHA256
        sync: false
      - key: ABSA_MODEL_URL
        sync: false
      - key: ABSA_MODEL_SHA256
        sync: false
